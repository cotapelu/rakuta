name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test -- --coverage

      - name: Quality Gate
        run: npm run quality-gate -- --threshold=90

      - name: Build
        run: npm run build

      - name: Security audit
        run: npm audit --audit-level=high || true

      - name: Performance Benchmark
        run: npm run benchmark -- --scenario=analyze_file --iterations=50

      # Optional: upload coverage to Codecov (if token available)
      # - name: Upload coverage to Codecov
      #   uses: codecov/codecov-action@v4
      #   with:
      #     token: ${{ secrets.CODECOV_TOKEN }}
